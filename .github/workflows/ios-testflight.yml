# AGUNA iOS build to TestFlight, run from this PUBLIC repo.
#
# Why this repo exists: on 23 Oct 2026 the private repo's free macOS minutes for
# October were used up and King's card was refused. King, 23 Oct: "if the public
# builder repo isnt harmful and will get build to testflight do it".
# Public repos get GitHub's standard runners free.
#
# What is public here: this file and the run logs. What is NOT: the app source
# (checked out at run time from the private repo Aguna18/aguna-ios-app with the
# SOURCE_TOKEN secret), the App Store Connect key (ASC_PRIVATE_KEY secret) and the
# built app (uploaded straight to App Store Connect, never kept as an artifact).
# Secrets are never given to pull requests from forks, and every job below
# refuses to run outside the Aguna18 account.
#
# Same steps as .github/workflows/ios-testflight.yml in the private repo: gates on
# Ubuntu, then ops/ios/build.sh on macOS. Uploads to TestFlight only. Never
# submits to App Review.
#
# Fired by a push that changes trigger.json, or by Run workflow.

name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trigger.json'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  # NO GATES JOB HERE (King, 13 Nov 2026: "whats the point of rerunning 240 checks").
  # Every gate already runs, and must pass, before anything is pushed to main
  # (CLAUDE.md section 4), so running the same 240 again here only added over an
  # hour to every build. This workflow builds what is on main and uploads it.
  # WHICH MAC BUILDS IT. Apple, 18 Nov 2026, on build 558 (ITMS-90725): "This app
  # was built with the iOS 26.2 SDK. Starting April 2027, iOS and iPadOS apps must
  # be built with the iOS 27 SDK or later". GitHub's image with Xcode 27 is the
  # label xcode-27 (read off actions/runner-images 19 Nov 2026: Xcode 27.2, iOS
  # 27.2 and watchOS 27.2 SDKs). EVERY BUILD RUNS ON xcode-27 since 25 Nov 2026
  # (King: "didnt we say from the next build itll be the xcode27"; 2.0.7 #1 was
  # built on macos-15 by mistake). trigger.json may name macos-15 only as a
  # fallback if an xcode-27 run fails.
  pick:
    if: github.repository_owner == 'Aguna18'
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.r.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        shell: bash
        run: |
          R=$(python3 -c "import json;print(json.load(open('trigger.json')).get('runner','xcode-27'))" 2>/dev/null || echo xcode-27)
          case "$R" in macos-15|macos-26|xcode-27) ;; *) R=xcode-27 ;; esac
          echo "runner=$R" >> "$GITHUB_OUTPUT"
          echo "Building on $R"
  build:
    if: github.repository_owner == 'Aguna18'
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Aguna18/aguna-ios-app
          ref: main
          token: ${{ secrets.SOURCE_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        shell: bash
        run: |
          set -o pipefail
          bash ops/ios/build.sh 2>&1 | tee "$RUNNER_TEMP/build-out.txt"
      - name: Report back to the private repo
        if: always()
        run: |
          # build.sh reads the KEPT CERTIFICATE lines of ops/ios/last-result.txt on
          # the next run, so the result goes back to the private repo as before.
          git checkout -- . && git clean -fdq -e node_modules
          {
            echo "run     $GITHUB_RUN_ID (Aguna18/aguna-ios-builder)"
            echo "commit  $(git rev-parse HEAD)"
            echo "result  ${{ job.status }}"
            echo "========================================"
            grep -E "error:|ARCHIVE|EXPORT|UPLOADED|WARNING|version .* build|KEPT CERTIFICATE|REVOKED" "$RUNNER_TEMP/build-out.txt" 2>/dev/null | head -40
            echo "---- last lines ----"
            tail -60 "$RUNNER_TEMP/build-out.txt" 2>/dev/null || echo "no output"
          } > ops/ios/last-result.txt
          git config user.name "aguna-ios-bot"
          git config user.email "support@aguna.app"
          git add ops/ios/last-result.txt
          git commit -m "ios: result for builder run $GITHUB_RUN_ID" || exit 0
          git pull --rebase origin main && git push origin HEAD:main
